name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The integration tests start Postgres (pgvector) and Redis with Testcontainers; the runner has Docker.
      - run: mvn -B verify

  verify-stack:
    name: Docker stack and verification scripts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the platform
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run scripts/verify.sh (smoke, load, cache, routing, streaming, failure drill)
        run: ./scripts/verify.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: reports/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
