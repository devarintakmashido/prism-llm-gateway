server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: prism-control-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PRISM_DB_URL:jdbc:postgresql://localhost:5432/prism}
    username: ${PRISM_DB_USER:prism}
    password: ${PRISM_DB_PASSWORD:prism}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${PRISM_REDIS_HOST:localhost}
      port: ${PRISM_REDIS_PORT:6379}
      timeout: 500ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    generator:
      write-bigdecimal-as-plain: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

prism:
  admin-token: ${PRISM_ADMIN_TOKEN:prism-admin-dev-token}
  data-dir: ${PRISM_DATA_DIR:data}
