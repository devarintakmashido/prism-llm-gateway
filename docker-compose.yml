# Prism: one command brings up the whole platform.
#
#   docker compose up --build -d
#
#   edge (nginx :8080)  ->  /v1/*, /health, /admin/route   -> gateway (data plane)
#                       ->  /admin/*, / (ops console)       -> control-plane
#
# Scale the data plane horizontally (rate limits and budgets stay correct, they live in Redis/Postgres):
#   docker compose up -d --scale gateway=2
name: prism

x-db-env: &db-env
  PRISM_DB_URL: jdbc:postgresql://postgres:5432/prism
  PRISM_DB_USER: prism
  PRISM_DB_PASSWORD: prism
  PRISM_REDIS_HOST: redis
  PRISM_DATA_DIR: /app/data
  PRISM_ADMIN_TOKEN: ${PRISM_ADMIN_TOKEN:-prism-admin-dev-token}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The provided mock providers, unchanged. Each requires its own provider key, which proves the
  # gateway injects provider credentials and never forwards the caller's virtual key.
  mock-alpha:
    build:
      context: .
      dockerfile: docker/mock-provider.Dockerfile
    command: ["--port", "9001", "--name", "alpha", "--api-key", "mock-key-alpha"]
    ports:
      - "9001:9001"

  mock-beta:
    build:
      context: .
      dockerfile: docker/mock-provider.Dockerfile
    command: ["--port", "9002", "--name", "beta", "--api-key", "mock-key-beta"]
    ports:
      - "9002:9002"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gateway
    environment:
      <<: *db-env
      PRISM_ALPHA_BASE_URL: http://mock-alpha:9001/v1
      PRISM_BETA_BASE_URL: http://mock-beta:9002/v1
      # Optional real provider. Set OPENROUTER_API_KEY in .env (the OPENAI_API_KEY / OPENAI_BASE_URL
      # names from Airtribe's perk page work too). Empty = OpenRouter stays disabled.
      PRISM_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-${OPENAI_API_KEY:-}}
      PRISM_OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-${OPENAI_BASE_URL:-}}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-alpha:
        condition: service_started
      mock-beta:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 900m

  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: control-plane
    environment:
      <<: *db-env
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 450m

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
      control-plane:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
