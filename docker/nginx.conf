# Edge proxy: one public port (8080) in front of the data plane and the control plane.
#
# Resolving "gateway" returns every replica, so `docker compose up --scale gateway=2`
# load-balances across them (round robin) without config changes.

upstream prism_gateway {
    server gateway:8080;
    keepalive 64;
}

upstream prism_control_plane {
    server control-plane:8081;
    keepalive 16;
}

server {
    listen 8080;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Streaming is graded on honesty: tokens must reach the client as the provider produces them.
    # nginx buffers upstream responses by default, which would turn a stream into one late blob.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    # Data plane
    location /v1/ {
        proxy_pass http://prism_gateway;
    }
    location = /health {
        proxy_pass http://prism_gateway;
    }
    location = /admin/route {
        proxy_pass http://prism_gateway;
    }

    # Control plane: admin APIs and the ops console
    location /admin/ {
        proxy_pass http://prism_control_plane;
    }
    location / {
        proxy_pass http://prism_control_plane;
    }
}
